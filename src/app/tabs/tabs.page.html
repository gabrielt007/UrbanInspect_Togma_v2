<ion-tabs>
  <!-- FAB global para registro rápido de incidencias (R5) -->
  <ion-fab slot="fixed" vertical="bottom" horizontal="end" class="fab-registro">
    <ion-fab-button color="danger" (click)="abrirRegistro()">
      <ion-icon name="add-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  <ion-tab-bar slot="bottom">
    <ion-tab-button tab="tab1" href="/tabs/tab1">
      <ion-icon aria-hidden="true" name="home-outline"></ion-icon>
      <ion-label>Inicio</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab2" href="/tabs/tab2">
      <ion-icon aria-hidden="true" name="list-outline"></ion-icon>
      <ion-label>Incidencias</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab3" href="/tabs/tab3">
      <ion-icon aria-hidden="true" name="bookmark-outline"></ion-icon>
      <ion-label>Seguimiento</ion-label>
    </ion-tab-button>
  </ion-tab-bar>
</ion-tabs>
